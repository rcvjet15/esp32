# ---------------------------------------------------------------------------
# Home Assistant configuration for the Fireplace Sound System.
#
# 1. Add to `configuration.yaml` (create the keys if they do not exist):
#
#   input_select:
#     fireplace_sound:
#       name: Fireplace Sound
#       icon: mdi:campfire
#       options:
#         - fireplace_1
#         - fireplace_3
#         - cozy_fireplace
#         - fire_crackling_bbq
#         - fireplace_heavy
#         - living_room_fireplace
#       initial: fireplace_1
#
#   input_boolean:
#     fireplace_sound_enabled:
#       name: Fireplace Sound Enabled
#       icon: mdi:volume-high
#       initial: true
#
#    - Each `input_select` option is an MP3 filename (no extension) in
#      /config/www/sounds/. Add an option + matching .mp3 to add a sound.
#    - `input_boolean.fireplace_sound_enabled` is the persistent on/off toggle
#      that directly plays/stops the sound (decoupled from the fireplace power).
#
# 2. Add the automation below to `automations.yaml`. The Home Assistant IP is
#    set to 192.168.1.104 — adjust if your HA IP differs.
#
#    The sound is INDEPENDENT of the fireplace: the "Sound On/Off" toggle
#    plays/stops it, the "Sound" dropdown picks the clip, and playback loops.
# ---------------------------------------------------------------------------

- id: 'fireplace_sound_control'
  alias: 'Fireplace Sound - Control'
  description: ''
  triggers:
  - trigger: state
    entity_id: input_boolean.fireplace_sound_enabled
  - trigger: state
    entity_id: input_select.fireplace_sound
  - trigger: state
    entity_id: media_player.fireplace_sound_player_fireplace_sound
    to: 'idle'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.fireplace_sound_enabled
        state: 'on'
      sequence:
      - action: media_player.play_media
        target:
          entity_id: media_player.fireplace_sound_player_fireplace_sound
        data:
          media_content_id: "http://192.168.1.104:8123/local/sounds/{{ states('input_select.fireplace_sound') }}.mp3"
          media_content_type: music
    default:
    - action: media_player.media_stop
      target:
        entity_id: media_player.fireplace_sound_player_fireplace_sound
