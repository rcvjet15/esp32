# ---------------------------------------------------------------------------
# Home Assistant configuration for the Fireplace Sound System.
#
# 1. Add to `configuration.yaml` (create the keys if they do not exist):
#
#   input_select:
#     fireplace_sound:
#       name: Fireplace Sound
#       icon: mdi:campfire
#       options:
#         - fireplace_1
#         - fireplace_3
#         - cozy_fireplace
#         - fire_crackling_bbq
#         - fireplace_heavy
#         - living_room_fireplace
#       initial: fireplace_1
#
#   input_boolean:
#     fireplace_sound_enabled:
#       name: Fireplace Sound Enabled
#       icon: mdi:volume-high
#       initial: true
#
#    - Each `input_select` option is an MP3 filename (no extension) in
#      /config/www/sounds/. Add an option + matching .mp3 to add a sound.
#    - `input_boolean.fireplace_sound_enabled` is the persistent on/off toggle.
#
#    Both live in Home Assistant (which is always powered), so their state
#    survives the ESP32 resetting or losing power — this is the "remembered
#    after reset/power-off" behaviour. The fireplace always resumes the
#    last-chosen sound and on/off state.
#
# 2. Add the automations below to `automations.yaml`. The Home Assistant IP is
#    already set to 192.168.1.104 — adjust if your HA IP differs.
#
#    NOTE: the fireplace on/off signal is `switch.fireplace_master` (a template
#    switch that is "on" while the fireplace is running, based on
#    sensor.uticnica_bor_power), not `switch.fireplace_power`.
# ---------------------------------------------------------------------------

- id: fireplace_sound_control
  alias: "Fireplace Sound - Control"
  trigger:
    - platform: state
      entity_id: switch.fireplace_master
    - platform: state
      entity_id: input_boolean.fireplace_sound_enabled
    - platform: state
      entity_id: input_select.fireplace_sound
    # Loop: replay when playback finishes and returns to idle.
    - platform: state
      entity_id: media_player.fireplace_sound_player_fireplace_sound
      to: "idle"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.fireplace_master
              state: "on"
            - condition: state
              entity_id: input_boolean.fireplace_sound_enabled
              state: "on"
          sequence:
            # Wait for the ESP32 to come online after boot (up to 30 s).
            - wait_template: "{{ not is_state('media_player.fireplace_sound_player_fireplace_sound', 'unavailable') }}"
              timeout: "00:00:30"
              continue_on_timeout: false
            - service: media_player.play_media
              target:
                entity_id: media_player.fireplace_sound_player_fireplace_sound
              data:
                media_content_id: "http://192.168.1.104:8123/local/sounds/{{ states('input_select.fireplace_sound') }}.mp3"
                media_content_type: "music"
      default:
        - service: media_player.media_stop
          target:
            entity_id: media_player.fireplace_sound_player_fireplace_sound
